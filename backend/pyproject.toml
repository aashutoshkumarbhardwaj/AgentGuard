[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "backend"
version = "1.0.0"
description = "AgentGuard backend engine and API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cedarpy>=4.12.0",
    "fastapi>=0.141.1",
    "pydantic>=2.0.0",
    "python-dotenv>=1.2.3",
    "boto3>=1.34.0",
    "mcp>=2.2.0",
    "httpx>=0.27.0",
    "torch>=2.14.0",
    "transformers>=5.17.0",
]

[dependency-groups]
dev = [
    "uvicorn>=0.53.0",
]

[tool.setuptools.packages.find]
include = ["app*"]
