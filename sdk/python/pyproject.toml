[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentguard-shield"
version = "1.0.0"
description = "Production-quality Python SDK for integrating AI agents with AgentGuard."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "AgentGuard Contributors", email = "hello@agentguard.com"}
]
dependencies = [
    "httpx>=0.24.0",
    "pydantic>=2.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "respx"
]
langchain = [
    "langchain-core"
]
crewai = [
    "crewai"
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["agentguard*"]
