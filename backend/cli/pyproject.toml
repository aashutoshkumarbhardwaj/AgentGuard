[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agentguard-cli"
version = "0.1.0"
description = "AgentGuard runtime security control plane CLI"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "requests>=2.31"
]

[project.scripts]
agentguard = "agentguard_cli.main:app"
