name: Deploy to AWS ECS

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "backend/**"
      - "infra/**"
      - "Dockerfile"
      - ".github/workflows/deploy-aws.yml"

env:
  AWS_REGION: ${{ secrets.AWS_REGION || 'ap-south-1' }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY || 'agentguard-backend' }}
  ECS_SERVICE: ${{ secrets.ECS_SERVICE || 'agentguard-service' }}
  ECS_CLUSTER: ${{ secrets.ECS_CLUSTER || 'agentguard-cluster' }}
  ECS_TASK_DEFINITION: infra/ecs/task-definition.template.json
  CONTAINER_NAME: agentguard-backend

jobs:
  deploy:
    name: Build & Deploy to AWS
    runs-on: ubuntu-latest
    if: secrets.AWS_ACCESS_KEY_ID != ''
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Build Docker image
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest ./backend
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Render ECS Task Definition
        id: render-task-def
        run: |
          sed -e "s|\${AWS_ACCOUNT_ID}|$(aws sts get-caller-identity --query Account --output text)|g" \
              -e "s|\${AWS_REGION}|${AWS_REGION}|g" \
              -e "s|\${ECR_REPO_NAME}|${ECR_REPOSITORY}|g" \
              -e "s|\${EFS_FILE_SYSTEM_ID}|${{ secrets.EFS_FILE_SYSTEM_ID || 'fs-dummy' }}|g" \
              -e "s|\${BEDROCK_GUARDRAIL_ID}|${{ secrets.BEDROCK_GUARDRAIL_ID || '' }}|g" \
              -e "s|\${BEDROCK_GUARDRAIL_VERSION}|${{ secrets.BEDROCK_GUARDRAIL_VERSION || '1' }}|g" \
              -e "s|\${FRONTEND_ORIGIN}|${{ secrets.FRONTEND_ORIGIN || 'https://agentguard.vercel.app' }}|g" \
              ${ECS_TASK_DEFINITION} > task-def-rendered.json
          echo "task-def=task-def-rendered.json" >> $GITHUB_OUTPUT

      - name: Fill in the new image ID in the Amazon ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-def-rendered.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
