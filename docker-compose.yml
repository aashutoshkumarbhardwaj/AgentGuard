version: "3.8"

services:
  agentguard-api:
    build:
      context: ./backend
    ports:
      - "8000:8000"   # REST API  →  /v1/authorize, /health, /audit
                      # MCP HTTP  →  /mcp  (Streamable HTTP, same process)
    environment:
      - AGENTGUARD_DB=/data/agentguard.db
      - AGENTGUARD_LOG_LEVEL=INFO
      - AGENTGUARD_ENV=development
      # Point to the mcp_servers.json mounted from /data (override at runtime)
      - MCP_CONFIG_PATH=/data/mcp_servers.json
    volumes:
      - agentguard_data:/data

volumes:
  agentguard_data:
